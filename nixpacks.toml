[phases.setup]
nixPkgs = ['python311', 'nodejs_20', 'go_1_23', 'ffmpeg', 'git', 'curl']

[phases.install]
cmds = [
    'pip install -r requirements.txt',
    'npm install',
    'cd YamzzBot-Caller-main && go build -o ../wp_whatsmeow_service . && chmod +x ../wp_whatsmeow_service || true'
]

[start]
cmd = 'python 5.py'
